<!doctype html>
<!--
  kbview.html —— 「知识库」侧栏的界面（跑在 XUL <browser> 里的普通 HTML 文档）

  **同一份页面服务两处**（2026-10-11 派发包 §四）：
    · 条目窗格那一列（点 rail 最下面的图标）
    · Zotero 阅读器右侧那一列（**同一个 rail 图标**打开）
  两处只是宿主的落点不同，页面一个字都不用改。

  ⚠ 2026-10-16（用户要求）：阅读器工具栏上原来还自建过一个「对照」按钮，
    与 rail 是**同一个入口的重复**（都是开/关这一列），已整条删除 ——
    打开/收起这一列**只走 rail**。

  为什么是**独立的 HTML 文档**而不是往 XUL 窗格里塞 innerHTML：
    · 主窗口是 XUL 文档，往里塞 HTML 片段会按 XML 解析 —— 一个没闭合的 <br>
      就让整段内容被静默丢弃（2026-10-05 实测，用户看到的正是"读了 34414 字、
      正文一片空白"）；
    · 这里可以**正常写 CSS**：overflow-wrap:anywhere、max-width:100%、
      公式、宽表格的横向滚动，一次到位；
    · 这里的脚本**会执行**（主窗口里 innerHTML 注入的不会），所以能跑
      markdown-it + KaTeX。

  分工（重要）：
    · **宿主（插件沙箱）负责取数据** —— 它对 IOUtils / Zotero.HTTP / kbDir 有权限，
      也已经有 kbLevels() / doc-edit / 分块 那一整套；
    · **这个页面只负责渲染与交互** —— 通过 JSON 字符串拿正文，
      用户的动作（切级别 / 重新读取 / 改这一页 / 收起）也原路回传。
  这样"数据在哪"只有一处事实来源，页面里不重复实现一遍权限逻辑。

  ⚠ 仍然不要把脚本 / 样式**内联**进这个文件（chrome 文档可能有 CSP），
     外链资源最稳。

  vendored（**原样引入、不放 CDN、离线可用**，派发包 §3.1）：
    · markdown-it 14.1.0  —— Markdown → HTML（MIT）
    · KaTeX 0.16.11       —— 公式排版（MIT，字体一起拷进 content/vendor/katex/fonts/）
  两者都在 content/vendor/ 下，各自带 LICENSE；audit_release 已登记白名单。
-->
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="color-scheme" content="light dark">
  <title>知识库预览</title>
  <link rel="stylesheet" href="vendor/katex/katex.min.css">
  <link rel="stylesheet" href="kbview.css">
</head>
<body>
  <div id="kbv-root" class="kbv-root">
    <header class="kbv-bar">
      <select id="kbv-level" class="kbv-sel" title="显示知识库的哪一级"></select>
      <!-- 正文字号没有挡位选择：唯一来源是面板「偏好设置 → 侧栏」里的数值（px）。 -->
      <button id="kbv-draft" class="kbv-btn" type="button" hidden
              title="导出整份正文为 edits 下的草稿文件（供外部编辑器修改）">导出草稿</button>
      <button id="kbv-reload" class="kbv-btn" type="button"
              title="重新从磁盘读一次">重新读取</button>
      <span id="kbv-hint" class="kbv-hint"></span>
      <button id="kbv-close" class="kbv-btn kbv-close" type="button"
              title="收起（回到 Zotero 原生的那一列）">✕</button>
    </header>
    <main id="kbv-view" class="kbv-view" tabindex="0"></main>
  </div>
  <!-- 公式修正（阅读器右键 → 「知识库：修正公式」）。宿主取好数据再送进来，
       本页只画界面；应用与 MathType 都由宿主去调本机服务。**不做识别**：
       LaTeX 由人写，或从 MathType 复制回来。 -->
  <div id="kbv-fml" class="kbv-fml" hidden>
    <div class="kbv-fml-box" role="dialog" aria-label="修正公式">
      <div class="kbv-fml-head">
        <b>修正公式</b>
        <span id="kbv-fml-where" class="kbv-fml-where"></span>
        <button id="kbv-fml-x" class="kbv-btn kbv-fml-x" type="button"
                title="关闭">✕</button>
      </div>
      <div class="kbv-fml-body">
        <div class="kbv-fml-left">
          <div class="kbv-fml-cap">原文（对着它改）</div>
          <img id="kbv-fml-img" class="kbv-fml-img" alt="这一块公式的原文裁剪">
        </div>
        <div class="kbv-fml-right">
          <div class="kbv-fml-cap">LaTeX（可改，右边实时预览）</div>
          <textarea id="kbv-fml-tex" class="kbv-fml-tex" spellcheck="false"
                    wrap="off"></textarea>
          <div id="kbv-fml-prev" class="kbv-fml-prev"></div>
        </div>
      </div>
      <div id="kbv-fml-cands" class="kbv-fml-cands" hidden>
        <span>这一页有多条公式，改的是：</span>
        <select id="kbv-fml-cand" class="kbv-sel"></select>
      </div>
      <div id="kbv-fml-msg" class="kbv-fml-msg"></div>
      <div class="kbv-fml-foot">
        <button id="kbv-fml-mt" class="kbv-btn" type="button">用 MathType 编辑</button>
        <span id="kbv-fml-mthint" class="kbv-fml-hint"></span>
        <span class="kbv-fml-sp"></span>
        <button id="kbv-fml-cancel" class="kbv-btn" type="button">取消</button>
        <button id="kbv-fml-apply" class="kbv-btn kbv-fml-primary" type="button">应用</button>
      </div>
    </div>
  </div>
  <script src="vendor/markdown-it/markdown-it.min.js"></script>
  <script src="vendor/katex/katex.min.js"></script>
  <script src="kbview.js"></script>
</body>
</html>
